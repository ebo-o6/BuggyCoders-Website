      a:focus-visible,

      input:focus-visible,

        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 1000;
        padding: 12px 20px;
        background: #fff;
        color: #212121;
        transform: translateY(-200%);

      .skip-link:focus {
        transform: translateY(0);
      }
      @media (max-width: 1023px) {
        .learn-more .bottom-cards {
          flex-wrap: wrap;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html,
        body,
        body * {
          scroll-behavior: auto;
        }
        body *,
        body *::before,
        body *::after {
          animation: none !important;
          transition: none !important;
        }
